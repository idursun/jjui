limit = 0

bindings_profile = ":builtin"

[ui]
  theme = ""
  # background_blend = 0.4 # optional; overrides both variants of the selected theme (0.0 to 1.0)
  # background_blend = { light = 0.2, dark = 0.4 } # optional per-variant overrides
  # set_window_title controls the terminal window title:
  #   true    - show the full repo path (default)
  #   "full"  - same as true
  #   "base"  - show only the directory name
  #   false   - disable the title
  set_window_title = true
  auto_refresh_interval = 0
  flash_message_display_seconds = 4 # 0 means display until manually dismissed
  mouse_support = true
  [ui.colors]

[suggest]
  [suggest.exec]
    mode = "off"

[revisions]
  log_batching = true
  log_batch_size = 50
  # template = 'builtin_log_compact' # overrides jj's templates.log
  # revset = "zzzzzzz"               # overrides jj's revsets.log

[preview]
  position = "auto"
  show_at_start = false
  width_percentage = 50.0
  width_increment_percentage = 5.0

  # Kinds without an entry fall back to "node".
  [preview.object.node]
    command = ["show", "--color", "always", "-r", "$object.change_id"]
  [preview.object.description]
    command = ["log", "--color", "always", "-r", "$object.change_id", "--no-graph", "-T", "description"]
  [preview.object.bookmark]
    command = ["diff", "--color", "always", "--from", "fork_point(trunk() | $object.value)", "--to", "$object.value"]
  [preview.object.conflicted_bookmark]
    command = ["bookmark", "list", "--color", "always", "$object.value"]
  [preview.object.conflict]
    command = ["resolve", "--color", "always", "--list", "-r", "$object.change_id"]
  [preview.object.file]
    command = ["diff", "--color", "always", "-r", "$object.change_id", "$object.value"]
  [preview.object.operation]
    command = ["op", "show", "$object.value", "--color", "always"]
  [preview.object.evolog]
    command = ["evolog", "--color", "always", "-r", "$object.value", "-p", "-n", "1"]
  [preview.object.remote]
    command = ["bookmark", "list", "--color", "always", "--remote", "$object.value"]
  [preview.object.remote_all]
    command = ["git", "remote", "list"]
  [preview.object.remote_local]
    command = ["bookmark", "list", "--color", "always"]

[oplog]
  limit = 200

[git]
  default_remote = "origin"

[askpass]
  enabled = true

[[actions]]
name = "revisions.evolog.split"
lua = """
 local historical_commit = context.commit_id()
 if not historical_commit then
   error("no evolog commit selected")
 end

 local change_id, err = jj({
   "log",
   "--ignore-working-copy",
   "--no-graph",
   "-r", historical_commit,
   "-T", "change_id.shortest()",
 })
 if err then
   error(err)
 end

 local current_commit
 current_commit, err = jj({
   "log",
   "--ignore-working-copy",
   "--no-graph",
   "-r", change_id,
   "-T", "commit_id.shortest()",
 })
 if err then
   error(err)
 end
 if current_commit == historical_commit then
   error("select a hidden evolog commit to split at")
 end

 local function run(args)
   flash("jj " .. table.concat(args, " "))
   local _, command_err = jj(args)
   if command_err then
     error(command_err)
   end
 end

 run({ "duplicate", "-r", change_id, "--insert-after", change_id })
 run({ "restore", "--from", historical_commit, "--into", change_id, "--restore-descendants" })

 jjui.builtin.revisions.evolog.cancel()
 jjui.builtin.revisions.refresh()
 """

[[actions]]
name = "revisions.show_bookmarks"
lua = """
 jjui.builtin.revset.show_bookmarks()
 jjui.builtin.revisions.object_focus({ kind = "bookmark" })
 """

[[actions]]
name = "revisions.show_remotes"
lua = """
 jjui.builtin.revset.show_remotes()
 jjui.builtin.revisions.object_focus({ kind = "bookmark" })
 """

[[actions]]
name = "revset.bookmarks.leave"
lua = """
 jjui.builtin.revset.bookmarks.exit()
 jjui.builtin.revisions.object_node()
 """

[[actions]]
name = "revisions.toggle_select"
lua = """
 jjui.builtin.revisions.toggle_select()
 jjui.builtin.revisions.move_down()
 """
