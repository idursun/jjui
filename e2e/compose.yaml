services:
  test:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ${JJUI_PATH:-..}:/jjui:ro
      - go-mod:/go/pkg/mod
      - go-build:/root/.cache/go-build
    environment:
      E2E_TEST: ${E2E_TEST:-}
    command:
      - sh
      - -c
      - go -C /jjui build -o /tmp/jjui ./cmd/jjui && JJUI_BIN=/tmp/jjui go test -tags=e2e -count=1 -parallel=${E2E_PARALLEL:-4} -shuffle=${E2E_SHUFFLE:-on} -run "$$E2E_TEST" -v ./...

volumes:
  go-mod:
  go-build:
